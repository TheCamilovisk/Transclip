# Closes slice issues when a vertical-slice PR is merged into `dev`.
#
# GitHub only interprets `Closes #N` keywords when the PR targets the
# repository's default branch (`main`); vertical-slice PRs target `dev`, so
# the keyword is ignored there. This workflow replicates the behavior: when a
# PR to `dev` is merged, it closes every open issue referenced with a closing
# keyword in the PR body. Only issues labeled `ai:vertical-slice` are closed,
# mirroring the slice workflow's intent.
name: Close linked issues

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced in the merged PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            let body = (pr && pr.body) || '';
            // The closed-event payload can omit the body for merged PRs;
            // fall back to the REST API when that happens.
            if (!body) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              body = data.body || '';
            }
            const keyword = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(keyword)].map((m) => Number(m[1])))];
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                if (!issue.labels.some((label) => label.name === 'ai:vertical-slice')) {
                  core.info(`#${issue_number} is not a vertical-slice issue; skipping`);
                  continue;
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: 'closed',
                });
                core.info(`closed #${issue_number}`);
              } catch (error) {
                core.warning(`could not close #${issue_number}: ${error.message}`);
              }
            }
