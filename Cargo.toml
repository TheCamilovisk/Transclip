[package]
name = "transclip"
version = "0.1.0"
edition = "2024"
description = "Terminal voice transcriber: record, transcribe locally with Whisper, copy to clipboard"
rust-version = "1.85"

[dependencies]
anyhow = "1"
cpal = "0.18.1"
crossterm = "0.29"
dasp_sample = "0.11"
dirs = "6.0"
hex = "0.4"
sha2 = "0.11"
thiserror = "2"
ureq = "3.4"
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3.27"
